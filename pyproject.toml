[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudml-v2"
version = "0.2.0"
description = "Retrospective fraud ranking experiments with causal histories and matched review budgets"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0,<2.4", "pandas>=2.2,<3", "scipy>=1.13,<1.17",
  "scikit-learn==1.6.1", "lightgbm==4.6.0", "joblib==1.5.3", "pyarrow>=18,<23"
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]
plots = ["matplotlib>=3.9,<3.11"]

[tool.setuptools.packages.find]
include = ["fraudml_v2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
